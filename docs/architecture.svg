<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="792" viewBox="0 0 1260 792" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#71717A"/>
    </marker>
    <marker id="arrowLight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A1A1AA"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16A34A"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/>
    </marker>
  </defs>
  <rect width="1260" height="792" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" fill="#18181B" text-anchor="start" font-weight="700">logistics-doc-automation — system architecture</text>
  <text x="40" y="68" font-size="12" fill="#52525B" text-anchor="start">Container view: what runs, what each part owns, and how they talk. Runtime branching lives in the processing-flow diagram.</text>
  <rect x="296" y="96" width="690" height="606" rx="12" fill="#FAFAFA" stroke="#A1A1AA" stroke-width="1.3" stroke-dasharray="6 5"/>
  <text x="312" y="688" font-size="11" fill="#71717A" text-anchor="start" font-weight="700">logistics-doc-automation  ·  one host, docker compose</text>
  <rect x="40" y="120" width="182" height="88" rx="10" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/>
  <text x="56" y="146" font-size="12.5" fill="#18181B" text-anchor="start" font-weight="700">Reviewer / Ops</text>
  <text x="56" y="162" font-size="10" fill="#71717A" text-anchor="start">[Person]</text>
  <text x="56" y="182" font-size="10.5" fill="#52525B" text-anchor="start">corrects flagged fields,</text>
  <text x="56" y="197" font-size="10.5" fill="#52525B" text-anchor="start">watches volume and cost</text>
  <rect x="40" y="246" width="182" height="88" rx="10" fill="#FFFFFF" stroke="#A1A1AA" stroke-width="1.5"/>
  <text x="56" y="272" font-size="12.5" fill="#18181B" text-anchor="start" font-weight="700">Document source</text>
  <text x="56" y="288" font-size="10" fill="#71717A" text-anchor="start">[External]</text>
  <text x="56" y="308" font-size="10.5" fill="#52525B" text-anchor="start">supplier invoices and</text>
  <text x="56" y="323" font-size="10.5" fill="#52525B" text-anchor="start">customs forms · PDF/JPG/PNG</text>
  <rect x="326" y="150" width="334" height="166" rx="10" fill="#FEF2F4" stroke="#EA4B71" stroke-width="1.5"/>
  <text x="342" y="176" font-size="13.5" fill="#BE123C" text-anchor="start" font-weight="700">n8n</text>
  <text x="342" y="193" font-size="10" fill="#9F1239" text-anchor="start">[Container: n8n 2.x · :5678]</text>
  <text x="342" y="216" font-size="10.5" fill="#52525B" text-anchor="start">doc_processing — webhook, extract call, status switch, HITL form</text>
  <text x="342" y="234" font-size="10.5" fill="#52525B" text-anchor="start">error_handler — runs on any failed execution (errorWorkflow)</text>
  <text x="342" y="252" font-size="10.5" fill="#52525B" text-anchor="start">owns: branching · retries 3× / 3 s · wait-resume · alerting</text>
  <text x="342" y="270" font-size="10.5" fill="#52525B" text-anchor="start">state: n8n_data volume · executions pruned after 14 days</text>
  <rect x="326" y="356" width="334" height="182" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="342" y="382" font-size="13.5" fill="#047857" text-anchor="start" font-weight="700">FastAPI extraction engine</text>
  <text x="342" y="399" font-size="10" fill="#065F46" text-anchor="start">[Container: Python · FastAPI · :8000]</text>
  <text x="342" y="422" font-size="10.5" fill="#18181B" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">routers</text>
  <text x="394.1" y="422" font-size="10.5" fill="#52525B" text-anchor="start">/extract · /review/{id} · /dead-letter · /documents</text>
  <text x="342" y="440" font-size="10.5" fill="#18181B" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">engine</text>
  <text x="387.8" y="440" font-size="10.5" fill="#52525B" text-anchor="start">rules → llm_extractor → confidence → budget caps</text>
  <text x="342" y="458" font-size="10.5" fill="#52525B" text-anchor="start">owns: extraction, validation, scoring — and the routing decision</text>
  <text x="342" y="476" font-size="10.5" fill="#18181B" text-anchor="start" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ops</text>
  <text x="368.9" y="476" font-size="10.5" fill="#52525B" text-anchor="start">/health = SELECT 1 (503 when db is down) · /live · /metrics</text>
  <rect x="326" y="578" width="334" height="92" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/>
  <text x="342" y="604" font-size="13.5" fill="#1D4ED8" text-anchor="start" font-weight="700">PostgreSQL</text>
  <text x="342" y="621" font-size="10" fill="#1E40AF" text-anchor="start">[Container: postgres:16 · pgdata volume]</text>
  <text x="342" y="644" font-size="10.5" fill="#52525B" text-anchor="start">documents · dead_letter</text>
  <text x="342" y="662" font-size="10.5" fill="#52525B" text-anchor="start">audit_log — every change, machine or human, with diffs</text>
  <rect x="730" y="356" width="226" height="114" rx="10" fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1.5"/>
  <text x="746" y="382" font-size="13.5" fill="#18181B" text-anchor="start" font-weight="700">Streamlit ops view</text>
  <text x="746" y="399" font-size="10" fill="#71717A" text-anchor="start">[Container: :8501]</text>
  <text x="746" y="422" font-size="10.5" fill="#52525B" text-anchor="start">volume · decision mix ·</text>
  <text x="746" y="440" font-size="10.5" fill="#52525B" text-anchor="start">cost · latency percentiles</text>
  <text x="746" y="458" font-size="10.5" fill="#52525B" text-anchor="start">read-only client of the API</text>
  <rect x="1030" y="470" width="210" height="122" rx="10" fill="#F4F4F5" stroke="#A1A1AA" stroke-width="1.5"/>
  <text x="1046" y="496" font-size="13.5" fill="#18181B" text-anchor="start" font-weight="700">OpenAI GPT-4o Vision</text>
  <text x="1046" y="513" font-size="10" fill="#71717A" text-anchor="start">[External system]</text>
  <text x="1046" y="536" font-size="10.5" fill="#52525B" text-anchor="start">called only for the fields</text>
  <text x="1046" y="554" font-size="10.5" fill="#52525B" text-anchor="start">the rule layer left empty</text>
  <text x="1046" y="572" font-size="10.5" fill="#52525B" text-anchor="start">45 s timeout, no SDK retries</text>
  <path d="M 222 289 H 320" fill="none" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="222.1125" y="265" width="99.775" height="30" rx="3" fill="#FFFFFF"/>
  <text x="272" y="276" font-size="9" fill="#52525B" text-anchor="middle">multipart POST</text>
  <text x="272" y="288" font-size="9" fill="#52525B" text-anchor="middle">/webhook/doc-upload</text>
  <path d="M 222 163 H 274 V 210 H 320" fill="none" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="227" y="144" width="52.525" height="18" rx="3" fill="#FFFFFF"/>
  <text x="232" y="155" font-size="9" fill="#52525B" text-anchor="start">HITL form</text>
  <path d="M 222 133 H 843 V 350" fill="none" stroke="#A1A1AA" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowLight)"/>
  <rect x="479.5625" y="117" width="80.875" height="18" rx="3" fill="#FFFFFF"/>
  <text x="520" y="128" font-size="9" fill="#71717A" text-anchor="middle">browser · :8501</text>
  <path d="M 493 316 V 350" fill="none" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="375.78125" y="326.5" width="234.4375" height="18.5" rx="3" fill="#FFFFFF"/>
  <text x="493" y="338.0" font-size="9.5" fill="#52525B" text-anchor="middle">HTTP · /extract · /review/{id} · /dead-letter</text>
  <path d="M 493 538 V 572" fill="none" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="365.80625" y="548.5" width="254.38750000000002" height="18.5" rx="3" fill="#FFFFFF"/>
  <text x="493" y="560.0" font-size="9.5" fill="#52525B" text-anchor="middle">SQL · pooled, reconnects after a database restart</text>
  <path d="M 660 500 H 1024" fill="none" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="725.2875" y="480.5" width="239.425" height="18.5" rx="3" fill="#FFFFFF"/>
  <text x="845" y="492.0" font-size="9.5" fill="#52525B" text-anchor="middle">HTTPS · vision extraction, missing fields only</text>
  <path d="M 730 413 H 666" fill="none" stroke="#71717A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="683.55" y="394" width="28.900000000000002" height="18" rx="3" fill="#FFFFFF"/>
  <text x="698" y="405" font-size="9" fill="#52525B" text-anchor="middle">HTTP</text>
  <rect x="40" y="734" width="1180" height="42" rx="8" fill="#18181B"/>
  <text x="60" y="760" font-size="11.5" fill="#FAFAFA"><tspan font-weight="700">Measured over 50 documents · </tspan><tspan>99.7% field accuracy</tspan><tspan fill="#71717A"> · </tspan><tspan>100% auto-approve precision</tspan><tspan fill="#71717A"> · </tspan><tspan font-weight="700" fill="#4ADE80">67% cheaper</tspan><tspan> and </tspan><tspan font-weight="700" fill="#4ADE80">~60× faster median</tspan><tspan> than a pure-LLM baseline, at identical accuracy</tspan></text>
</svg>
